$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "http://purl.org/iscc/schema/iscc-index.json"
title: "IsccIndex"
type: object
description: A named index for searching and matching ISCCs
required:
  - name
properties:
  name:
    type: string
    description: Short unique name of the index (valid code identifier)
    pattern: "^[a-z][a-z0-9]*$"
    minLength: 1
    maxLength: 32
    example: "default"
  assets:
    type: integer
    description: Number of ISCCs in the index (server-generated, read-only)
    minimum: 0
    readOnly: true
    example: 150000
  size:
    type: integer
    description: Size of index in megabytes (server-generated, read-only)
    minimum: 0
    readOnly: true
    example: 42
  sizes:
    type: object
    description: >-
      Size in megabytes per index component (server-generated, read-only).
      Key "lmdb" covers primary key-value storage measured on disk; additional
      keys are derived similarity sub-indexes named by ISCC-UNIT-TYPE or
      simprint type, measured as serialized data size from the live index
      (includes unflushed data).
    additionalProperties:
      type: integer
      minimum: 0
    readOnly: true
    example:
      lmdb: 30
      CONTENT_TEXT_V0: 12
example:
  name: "production"
  assets: 250000
  size: 68
